[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv", "alembic/versions"]

[tool.pytest.ini_options]
pythonpath = ["."]
